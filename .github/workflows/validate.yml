name: Validate macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test
      - name: Package release app with ad-hoc signature
        run: scripts/build-app.sh release
      - name: Verify packaged executable and resources
        run: scripts/verify-app.sh
      - name: Package internal test app
        run: scripts/build-app.sh release test
      - name: Verify internal test app
        run: scripts/verify-app.sh "build/Axios Notch Teste.app"
